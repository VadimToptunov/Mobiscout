<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark-theme Marketplace icon: brighter teal + a slightly muted screen so the
       glyph reads on a dark listing card. Mirrors pluginIcon.svg. -->
  <!-- Phone body -->
  <rect x="9" y="3" width="22" height="34" rx="4" fill="#2AA697"/>
  <rect x="11" y="7" width="18" height="26" rx="1.5" fill="#E6F5F1"/>
  <!-- Interaction graph: nodes + edges (the app's navigation map) -->
  <line x1="16" y1="13" x2="24" y2="13" stroke="#2AA697" stroke-width="1.6"/>
  <line x1="16" y1="13" x2="16" y2="21" stroke="#2AA697" stroke-width="1.6"/>
  <line x1="24" y1="13" x2="24" y2="27" stroke="#2AA697" stroke-width="1.6"/>
  <line x1="16" y1="21" x2="24" y2="27" stroke="#2AA697" stroke-width="1.6"/>
  <circle cx="16" cy="13" r="3" fill="#34D399"/>
  <circle cx="24" cy="13" r="3" fill="#2AA697"/>
  <circle cx="16" cy="21" r="3" fill="#2AA697"/>
  <circle cx="24" cy="27" r="3" fill="#34D399"/>
</svg>

[package]
name = "mobiscout-core"
version = "0.2.0"
edition = "2021"
authors = ["Vadim Toptunov <your-email@example.com>"]
description = "High-performance Rust core for Mobile Test Recorder"
license = "MIT"

[lib]
name = "mobiscout_core"
crate-type = ["cdylib"]  # Dynamic library for Python

[dependencies]
# Python bindings
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }

# AST parsing
syn = { version = "2.0", features = ["full", "parsing"] }
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-java = "0.21"
tree-sitter-kotlin = "0.3"
tree-sitter-swift = "0.5"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"

# Parallel processing
rayon = "1.8"
tokio = { version = "1.35", features = ["full"] }

# Data structures & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.1"  # Ordered HashMap

# Regex
regex = "1.10"
once_cell = "1.19"

# File I/O
memmap2 = "0.9"
walkdir = "2.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
criterion = "0.5"  # Benchmarking
proptest = "1.4"   # Property testing
tempfile = "3.8"   # Temporary files for testing

# Native criterion benches aren't practical here: the pyo3 `extension-module` build
# doesn't link libpython, so a standalone bench binary can't resolve Python symbols
# (the same reason CI omits `cargo test` — see .github/workflows/ci.yml). The complexity
# accelerator is benchmarked at the Python level instead, against the pure-Python
# fallback on identical inputs — see scripts/bench_native.py.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

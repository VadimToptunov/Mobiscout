[package]
name = "mobiscout-core"
version = "0.2.0"
edition = "2021"
authors = ["Vadim Toptunov <your-email@example.com>"]
description = "High-performance Rust core for Mobile Test Recorder"
license = "MIT"

[lib]
name = "mobiscout_core"
# cdylib is the Python extension module; rlib additionally lets `cargo test` link the
# crate, so the #[cfg(test)] unit tests can actually run (see the `features` block).
crate-type = ["cdylib", "rlib"]

[features]
# `extension-module` tells pyo3 NOT to link libpython — required for the shipped wheel,
# but it also means a test binary can't resolve Python symbols, which is why the unit
# tests never ran. Keeping it a *default* feature leaves the wheel/build path unchanged
# while `cargo test --no-default-features` links libpython and runs them.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
# Python bindings
pyo3 = { version = "0.29", features = ["abi3-py38"] }

# AST parsing
syn = { version = "2.0", features = ["full", "parsing"] }
# Keep the core and every grammar on the same tree-sitter ABI generation. Grammars
# from 0.23 on expose `LANGUAGE: LanguageFn` instead of `language()`, so a lone
# grammar bump breaks the build — dependabot groups them (see .github/dependabot.yml)
# so they are proposed together.
tree-sitter = "0.26"
tree-sitter-python = "0.25"
tree-sitter-java = "0.23"
# tree-sitter-kotlin (0.3.x) is stuck on the tree-sitter 0.20 ABI, which puts a
# SECOND tree-sitter crate in the graph and makes its Language type incompatible
# with everything else. -ng is the maintained successor on the current ABI.
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

# Parallel processing
rayon = "1.8"
tokio = { version = "1.35", features = ["full"] }

# Data structures & serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = "2.1"  # Ordered HashMap

# Regex
regex = "1.10"
once_cell = "1.19"

# File I/O
memmap2 = "0.9"
walkdir = "2.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
criterion = "0.5"  # Benchmarking
proptest = "1.4"   # Property testing
tempfile = "3.8"   # Temporary files for testing

# Native criterion benches aren't practical in the default build: `extension-module`
# doesn't link libpython, so a standalone bench binary can't resolve Python symbols.
# (Unit tests get around this with `cargo test --no-default-features`.) The complexity
# accelerator is benchmarked at the Python level instead, against the pure-Python
# fallback on identical inputs — see scripts/bench_native.py.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Dependency-update monitoring. Dependabot opens weekly PRs when Python
# packages (incl. appium-python-client, selenium), GitHub Actions, or the
# JetBrains-plugin Gradle deps change — so the tool tracks the Appium
# ecosystem and its libraries automatically.
version: 2
updates:
  # Python runtime + dev dependencies.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # One PR for the Appium/Selenium client stack — they move together.
      appium-stack:
        patterns:
          - "appium-python-client"
          - "selenium"
      dev-tooling:
        patterns:
          - "pytest*"
          - "black"
          - "flake8"
          - "mypy"
    labels:
      - "dependencies"

  # GitHub Actions used by CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"

  # JetBrains plugin Gradle dependencies (IntelliJ platform, Kotlin, etc.).
  - package-ecosystem: "gradle"
    directory: "/jetbrains-plugin"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "plugin"

  # Rust core (mobiscout_core), which is compiled into every shipped engine binary.
  # Its Cargo.lock is committed for reproducible builds, so without this entry a crate
  # advisory would sit pinned in the released binary until someone bumped it by hand.
  - package-ecosystem: "cargo"
    directory: "/rust_core"
    schedule:
      interval: "weekly"
    groups:
      # The core and every grammar share one tree-sitter ABI generation, so bumping a
      # single grammar cannot compile (0.23+ replaced `language()` with `LANGUAGE`).
      # One grouped PR keeps them upgradeable; six separate ones are six red builds.
      tree-sitter:
        patterns:
          - "tree-sitter*"
    labels:
      - "dependencies"
      - "rust"

name: Build standalone engine (variant C)

# Freezes the Mobiscout engine into a self-contained per-platform binary (no user
# Python) with PyInstaller. Kept off the per-PR path (building 4 platforms is
# heavy) — run it on demand, on version tags, or when a release is published; the
# binaries are uploaded as artifacts and, for a release, attached to it.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write  # attach binaries to the release

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # Apple Silicon (native arm64)
            artifact: mobiscout-engine-macos-arm64
            binary: dist/mobiscout-engine
          - os: macos-14        # Intel: cross-built as x86_64 under Rosetta on the arm64
            artifact: mobiscout-engine-macos-x64  # runner — GitHub's macos-13 Intel runners
            binary: dist/mobiscout-engine         # are being retired and queue indefinitely.
            x86: true
          - os: ubuntu-latest
            artifact: mobiscout-engine-linux-x64
            binary: dist/mobiscout-engine
          - os: windows-latest
            artifact: mobiscout-engine-windows-x64.exe
            binary: dist/mobiscout-engine.exe
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        # The compiled accelerator (mobiscout_core) is bundled into the frozen engine — the
        # smoke test below fails the build if it isn't. dtolnay/rust-toolchain is the
        # maintained toolchain action (actions-rs/* is archived), matching ci.yml.
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        if: ${{ matrix.x86 != true }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Set up x86_64 Python under Rosetta (Intel cross-build)
        # GitHub's arm64 macOS runner has no x86_64 Python; install the universal2
        # CPython from python.org (it carries an x86_64 slice) and drive it under
        # `arch -x86_64`, so pip pulls x86_64 wheels and PyInstaller freezes an
        # x86_64 binary that Intel Macs can run natively.
        if: ${{ matrix.x86 == true }}
        run: |
          sudo softwareupdate --install-rosetta --agree-to-license
          PYVER=3.13.1
          curl -fsSL -o /tmp/python.pkg "https://www.python.org/ftp/python/${PYVER}/python-${PYVER}-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          PYBIN="/Library/Frameworks/Python.framework/Versions/3.13/bin/python3"
          echo "PYBIN=$PYBIN" >> "$GITHUB_ENV"
          arch -x86_64 "$PYBIN" -c "import platform; print('interpreter arch:', platform.machine())"

      - name: Install engine (lean core) + build tooling
        # Core install only — NOT requirements.txt (which pulls the ~436 MB ML/viz
        # stack) and NOT editable. The default crawl -> classify -> codegen path is
        # heuristic-first and needs none of that, so the frozen binary stays lean
        # (~25 MB, vs ~460 MB with the full stack). A non-editable install also
        # copies `framework` into site-packages so PyInstaller can collect it (an
        # editable install leaves it a .pth shim that collect_submodules misses).
        # The ML/visual/viz upgrades remain available via `mobiscout[ml|visual|viz]`.
        if: ${{ matrix.x86 != true }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller maturin
          # Build + install the Rust accelerator so the frozen binary bundles it. Mirrors
          # ci.yml's Build Rust Core: `maturin build` in rust_core -> wheel in
          # rust_core/target/wheels. The import gate makes it MANDATORY — a failed/absent
          # build stops the release here, not silently at the user (the pure-Python fallback
          # stays a dev-only path).
          ( cd rust_core && maturin build --release )
          WHEEL=$(python -c "import glob; print(sorted(glob.glob('rust_core/target/wheels/*.whl'))[-1])")
          pip install "$WHEEL"
          python -c "import mobiscout_core; print('mobiscout_core bundled')"

      - name: Freeze
        if: ${{ matrix.x86 != true }}
        shell: bash
        run: |
          set -o pipefail
          pyinstaller packaging/mobiscout-engine.spec --noconfirm --clean 2>&1 | tee freeze.log
          # NOTE: do not add a log-grep guard here. collect_submodules() warns only ONCE
          # and then ignores later failures, and it walks LIFO — so the knowingly-optional
          # framework.dashboard (needs uvicorn, absent from the lean install) always eats
          # that one warning and every real drop after it is silent. The binary proves its
          # own completeness in the "Self-test" step below instead.

      - name: Install + Freeze (x86_64 under Rosetta)
        # Same lean-core install and freeze as above, but every step runs the
        # universal2 Python's x86_64 slice so the frozen binary is Intel.
        if: ${{ matrix.x86 == true }}
        run: |
          arch -x86_64 "$PYBIN" -m pip install --upgrade pip
          arch -x86_64 "$PYBIN" -m pip install .
          arch -x86_64 "$PYBIN" -m pip install pyinstaller maturin
          # Cross-build the Rust accelerator for x86_64 (abi3 wheel) and install it into the
          # x86 Python, so the Intel binary bundles it too (mandatory — smoke test asserts it).
          rustup target add x86_64-apple-darwin
          ( cd rust_core && "$(dirname "$PYBIN")/maturin" build --release --target x86_64-apple-darwin -i "$PYBIN" )
          WHEEL=$(ls rust_core/target/wheels/*.whl | head -1)
          arch -x86_64 "$PYBIN" -m pip install "$WHEEL"
          arch -x86_64 "$PYBIN" -c "import mobiscout_core; print('mobiscout_core (x86_64) OK')"
          set -o pipefail
          arch -x86_64 "$PYBIN" -m PyInstaller packaging/mobiscout-engine.spec --noconfirm --clean 2>&1 | tee freeze.log
          # Completeness is proven by the "Self-test" step below, not by grepping this
          # log — see the note in the non-x86 Freeze step.

      - name: Self-test (the binary proves it bundled everything)
        shell: bash
        # Imports every lazily-reached subpackage and renders EVERY codegen target through
        # the real emitters, so a missing module OR a missing .j2 data file fails the build
        # here instead of on the first user who picks that language.
        run: |
          "${{ matrix.binary }}" --selftest

      - name: Smoke test (runs with no interpreter dependency)
        shell: bash
        run: |
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"health/check","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"selector/generate","params":{"platform":"android","element":{"resource_id":"com.example:id/login_button","text":"Log in","class":"android.widget.Button","clickable":true}}}' \
            | "${{ matrix.binary }}")
          echo "$out"
          echo "$out" | grep -q '"status": "ok"' || { echo "engine did not respond ok"; exit 1; }
          # Mandatory Rust: the shipped binary must run the compiled accelerator, never the
          # pure-Python fallback. If the core didn't get bundled, fail here rather than ship it.
          echo "$out" | grep -q '"native_backend": "rust"' || {
            echo "engine shipped WITHOUT the Rust core (native_backend != rust)"; exit 1; }
          # health/check imports almost nothing, so it passed even when the bundle was
          # missing modules. selector/generate is the device-free request that drives the
          # real crawler parse -> classify -> locator path, so a subpackage that didn't
          # make it into the binary fails here instead of at the first user.
          echo "$out" | grep -q '"found": true' || {
            echo "selector/generate did not resolve an element in the frozen binary"; exit 1; }

      - name: Rename + checksum
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.binary }}" "out/${{ matrix.artifact }}"
          cd out
          # sha256sum on Linux/Windows(git-bash), shasum on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi
          cat "${{ matrix.artifact }}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/${{ matrix.artifact }}
            out/${{ matrix.artifact }}.sha256
          if-no-files-found: error

      - name: Create / attach release
        # On a tag push, create the release for the tag and upload the binaries;
        # on a published release, attach to it. Either way the plugin's
        # EngineProvider can then GET releases/download/<tag>/<asset>. Without the
        # tag-push case, `git push vX.Y.Z` built artifacts but published nothing,
        # so the plugin's download 404'd.
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # GitHub raises no workflow runs for events caused by GITHUB_TOKEN, so a release
          # created with the default token never fired ci.yml's `release: published` — the
          # publish jobs simply never ran on the tag-push route. A PAT does fire them;
          # falls back to the default token when RELEASE_PAT isn't configured.
          token: ${{ secrets.RELEASE_PAT || github.token }}
          files: |
            out/${{ matrix.artifact }}
            out/${{ matrix.artifact }}.sha256

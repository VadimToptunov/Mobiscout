name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    # Releasing by pushing a vX.Y.Z tag matched no branch filter, so the whole suite
    # was skipped on exactly the commit being shipped — a release could go out with
    # lint, tests, codegen and integration never run.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: '3.13'
  RUST_VERSION: 'stable'

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # black is pinned in requirements.txt — don't reinstall (would pull
          # the latest, whose formatting differs and breaks --check).
          # mypy is pinned too: an unpinned upgrade silently tightens checks and
          # reds the job on code that was clean the day before.
          pip install flake8 mypy==2.3.1 interrogate

      - name: Run Black (code formatter check)
        run: black --check framework tests

      - name: Run Flake8 (linter)
        run: |
          # Stop build on syntax errors or undefined names
          flake8 framework --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings (informational: style + complexity>10)
          flake8 framework --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
          # Enforced complexity ceiling: fails only if a function grows MORE complex than
          # today's worst (21). A real ratchet — lower it as the hotspots are refactored.
          flake8 framework --count --select=C901 --max-complexity=21 --statistics

      - name: Check docstring coverage (interrogate)
        run: interrogate framework

      - name: Run MyPy (type checker)
        run: mypy framework --ignore-missing-imports --no-error-summary

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run security scanner
        run: |
          python -c "
          from framework.security.config import validate_no_hardcoded_secrets
          from pathlib import Path
          import sys
          
          issues = []
          for py_file in Path('framework').rglob('*.py'):
              code = py_file.read_text()
              file_issues = validate_no_hardcoded_secrets(code, str(py_file))
              issues.extend(file_issues)
          
          if issues:
              print('❌ Security issues found:')
              for issue in issues:
                  print(f\"  {issue['type']}: {issue['file']}:{issue['line']}\")
              sys.exit(1)
          else:
              print('✅ No hardcoded secrets found')
          "

      - name: Audit dependencies for known vulnerabilities (findings informational)
        # The AUDIT is a real gate now. `safety check --json || true` discarded every
        # non-zero exit, including safety's own — `check` is deprecated and its removal
        # from the unpinned install would have left the job green having scanned nothing.
        # Pinned tool + "a report must exist" catches that. The FINDINGS stay
        # informational deliberately: the advisory feed moves on its own, so a CVE
        # published against a transitive dependency would otherwise red every unrelated
        # PR until someone is free to act on it.
        run: |
          pip install pip-audit==2.10.1
          # --skip-editable: `pip install -e .` above leaves mobiscout itself in the
          # environment, and it has no PyPI release to look up.
          pip-audit --skip-editable --progress-spinner=off --format=json --output=audit.json || true
          python - <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path("audit.json")
          if not report.is_file():
              sys.exit("pip-audit produced no report — the audit did not run")
          data = json.loads(report.read_text())
          findings = [
              (dep["name"], dep["version"], vuln["id"], ", ".join(vuln.get("fix_versions") or []) or "none")
              for dep in data["dependencies"]
              for vuln in dep.get("vulns", [])
          ]
          for name, version, vuln_id, fix_versions in findings:
              print(f"{name}=={version}  {vuln_id}  fixed in: {fix_versions}")
          print(f"{len(findings)} known vulnerabilities across {len(data['dependencies'])} installed packages")
          PY

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    # 3.13 is the supported target and gates merges. 3.14 is forward-looking and
    # non-blocking: its scientific-stack wheels (scipy/opencv under xdist) can
    # segfault into a pytest INTERNALERROR — track it, don't let it block the queue.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false  # one job's failure must not cancel the others
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ '3.13', '3.14' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist pytest-timeout
          pip install -e .

      - name: Run tests
        # Force bash so the backslash line-continuations parse on Windows
        # (the default shell there is PowerShell, which fails to parse them).
        shell: bash
        run: |
          pytest tests/ \
            --cov=framework \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term \
            --cov-fail-under=87 \
            -v \
            -n auto

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  codegen:
    name: Codegen Targets (multi-language)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Set up Java (javac gate for Java targets)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js (node --check gate for JS targets)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up Kotlin (kotlinc gate for Kotlin targets)
        run: sudo snap install --classic kotlin

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - name: Show toolchains (gates must run, not skip)
        run: |
          python --version
          javac -version
          node --version
          kotlinc -version

      - name: Validate every codegen target (golden + real toolchain compile)
        run: pytest tests/codegen/ -v

  build-rust:
    name: Build Rust Core
    runs-on: ${{ matrix.os }}
    strategy:
      # Report each OS independently instead of cancelling siblings on the
      # first failure.
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        # actions-rs/* is archived (runs on Node 12 and now hard-fails);
        # dtolnay/rust-toolchain is the maintained replacement.
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install maturin
        run: pip install maturin

      - name: Compile Rust core
        working-directory: rust_core
        run: cargo build --release

      - name: Run Rust unit tests
        working-directory: rust_core
        # --no-default-features drops pyo3's `extension-module`, which is what stops a
        # test binary linking libpython; without this the crate's #[cfg(test)] tests were
        # dead code that never compiled. The wheel below still builds WITH the feature.
        run: cargo test --no-default-features

      - name: Build Python wheel
        working-directory: rust_core
        run: maturin build --release

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-wheel-${{ matrix.os }}
          path: rust_core/target/wheels/*.whl

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [ lint, test, build-rust ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y android-tools-adb

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Download Rust wheels
        uses: actions/download-artifact@v8
        with:
          name: rust-wheel-ubuntu-latest
          path: wheels/

      - name: Install Rust core
        # No `|| echo "Rust core optional"` fallback: the wheel this job downloads is the
        # same artifact the release ships, and build-engine.yml refuses to ship a binary
        # whose native_backend isn't "rust". Swallowing a failed install let the whole
        # integration suite run on the pure-Python fallback and still report green.
        run: pip install wheels/*.whl

      - name: "End-to-end (device-free): crawl -> kit -> emitted kit runs green"
        run: |
          # The real integration: the whole crawl->model->codegen pipeline against a
          # fake UI graph, AND an emitted python_pytest kit executed through pytest
          # against a device-free fake Appium — so "generated tests pass" is checked by
          # execution, not by py_compile. (The old job started a mock backend it never
          # called and ran `mobiscout --help`; that proved nothing.)
          pytest tests/test_pipeline.py tests/codegen/test_kit_execution.py -v

      - name: CLI does-not-crash smoke
        run: |
          mobiscout info
          mobiscout --help

  build-plugin:
    name: Build JetBrains Plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        # The committed Gradle wrapper (jetbrains-plugin/gradlew + wrapper jar)
        # pins Gradle 9.6.1, which the IntelliJ Platform Gradle Plugin 2.18.1
        # requires (it refuses anything below 9.0). Invoke it via ./gradlew.
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Run plugin unit tests
        working-directory: jetbrains-plugin
        run: ./gradlew test

      - name: Build plugin
        working-directory: jetbrains-plugin
        run: ./gradlew buildPlugin

      - name: Verify plugin
        working-directory: jetbrains-plugin
        run: ./gradlew verifyPlugin

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: jetbrains-plugin
          path: jetbrains-plugin/build/distributions/*.zip

  publish-pypi:
    name: Publish to PyPI
    # Opt-in: distribution is bundle-in-plugin, not PyPI. Enable only by setting the
    # repo variable PUBLISH_PYPI=true AND the PYPI_API_TOKEN secret. Off by default so
    # a release doesn't red on a channel we don't use / an unset token.
    if: github.event_name == 'release' && vars.PUBLISH_PYPI == 'true'
    needs: [ lint, test, build-rust, integration-test ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          path: wheels/
          merge-multiple: true

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  publish-plugin:
    name: Publish Plugin to JetBrains Marketplace
    # Opt-in: the FIRST Marketplace submission must be done manually via the web UI
    # (publishPlugin only updates an already-listed plugin). Enable auto-updates later
    # by setting the repo variable PUBLISH_PLUGIN=true AND the JETBRAINS_MARKETPLACE_TOKEN
    # secret. Off by default so a release doesn't red before the listing exists.
    if: github.event_name == 'release' && vars.PUBLISH_PLUGIN == 'true'
    # The plugin is a thin frontend over the Python engine, so the engine's gates decide
    # whether it is shippable. Gating on build-plugin alone let a release publish with the
    # whole Python suite red. Same set as publish-pypi, plus codegen and the plugin build.
    needs: [ lint, test, codegen, build-rust, integration-test, build-plugin ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Engine binaries for this tag must already be attached
        # EngineProvider downloads mobiscout-engine-* from releases/download/<ENGINE_VERSION>.
        # build-engine.yml is a separate workflow with no ordering against this one, so
        # listing the plugin before it has attached the assets leaves every new user on
        # "No engine available". Refuse to publish until they are there.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')
          echo "$assets"
          for asset in mobiscout-engine-macos-arm64 mobiscout-engine-macos-x64 \
                       mobiscout-engine-linux-x64 mobiscout-engine-windows-x64.exe; do
            echo "$assets" | grep -qx "$asset" || {
              echo "release ${{ github.ref_name }} is missing engine asset: $asset"; exit 1; }
          done

      - name: Publish plugin
        working-directory: jetbrains-plugin
        env:
          # Must be PUBLISH_TOKEN — the name build.gradle.kts reads. This exported
          # JETBRAINS_TOKEN, which nothing read, so publishPlugin ran without a token.
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          # Sign the archive before upload. Unset secrets arrive as empty strings, which
          # build.gradle.kts filters out, so an unsigned upload stays possible.
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
